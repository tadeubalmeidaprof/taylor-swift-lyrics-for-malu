services:
  - type: web
    name: swifterlyricsformalu
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      # Sempre revalidar o HTML para encontrar novos builds.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # O Vite usa hashes nos nomes dos arquivos gerados.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://yvzzvmxrmitbrpcbcbim.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
